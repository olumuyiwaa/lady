name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Generates the Prisma client; the unit tests mock the database layer,
      # so no database is needed here.
      - run: npx prisma generate
      - run: npm run test:unit
